[package]
name = "tectora-core"
version.workspace = true
edition = "2024"

[dependencies]
dirs = "6"
flate2 = "1"
geo = "0.31"
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"
# AI apps' configuration files, changed keeping their comments (assistants.rs).
toml_edit = "0.25"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
approx = "0.5.1"
flate2 = "1.1"
proptest = "1"

# The browser preview's bridge carries its own self-tests (the E2E lock
# wait, audit 2026-11-23 TEST-1203): `cargo test` builds and runs them.
[[example]]
name = "ui_bridge"
test = true
