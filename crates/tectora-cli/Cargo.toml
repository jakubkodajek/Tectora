[package]
name = "tectora-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
tectora-core = { version = "0.1.0", path = "../tectora-core" }
