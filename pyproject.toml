[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tectora"
version = "0.1.0"
description = "Kalkulátor střech — desktopová aplikace a CLI pro výpočet ploch, hřebenů, nároží a dalších rozměrů střech"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jakub Kodajek" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "openpyxl>=3.1",
    "euclid3>=0.1",  # used by the vendored polyskel straight-skeleton (LGPL)
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
build = [
    "pyinstaller>=6.6",
]

[project.scripts]
tectora = "tectora.cli.main:main"
tectora-gui = "tectora.gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
